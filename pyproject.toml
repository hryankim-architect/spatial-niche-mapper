[project]
name = "spatialniche"
version = "0.1.0"
description = "Capability-portrait POC: spatial-transcriptomics spot deconvolution + tissue niche detection."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "H. Ryan Kim" },
]
requires-python = ">=3.11"

dependencies = [
    "click>=8.1.7",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "mlflow>=2.11.0",
]

[project.optional-dependencies]
# Canonical spatial stack the method targets on real data. The demo runs without
# these (synthetic arrays); a user pointing at real Visium/Xenium would install them.
spatial = [
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "squidpy>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
spatialniche = "spatialniche.pipeline:cli"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialniche"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
